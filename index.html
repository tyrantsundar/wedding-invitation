<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta id="meta-description" name="description" content="" />

    <title id="page-title"></title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- =========================
         HERO SECTION
    ========================== -->

    <main class="hero">
      <div class="hero-content">
        <div class="decorative-symbol">ॐ</div>

        <p class="invitation-text" id="hero-invitation-label"></p>

        <div class="divider">
          <span></span>
          <span>✦</span>
          <span></span>
        </div>

        <p class="invite-message" id="hero-message"></p>

        <h1 class="couple-names" id="hero-couple-names"></h1>

        <p class="wedding-date" id="hero-wedding-date"></p>

        <div class="divider">
          <span></span>
          <span>♥</span>
          <span></span>
        </div>

        <p class="scroll-text" id="hero-scroll-text"></p>

        <div class="scroll-arrow">↓</div>
      </div>
    </main>

    <!-- =========================
         EVENTS SECTION
    ========================== -->

    <section class="events-section">
      <div class="section-heading">
        <p class="section-label" id="celebrations-label"></p>

        <h2 id="celebrations-title"></h2>

        <div class="heading-divider">✦</div>

        <p id="celebrations-description"></p>
      </div>

      <div class="events-container">
        <!-- =========================
             WEDDING
        ========================== -->

        <article class="event-card">
          <div class="event-icon">♡</div>

          <p class="event-type" id="wedding-event-type"></p>

          <h3 id="wedding-event-title"></h3>

          <div class="event-divider">✦</div>

          <p class="event-date" id="wedding-event-date"></p>

          <p class="event-time" id="wedding-event-time"></p>

          <p class="event-location" id="wedding-event-location"></p>

          <div class="event-buttons">
            <button
              type="button"
              class="event-button"
              id="wedding-event-button"
              onclick="openEvent('wedding')"
            ></button>

            <a
              class="location-button"
              id="wedding-location-button"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            ></a>
          </div>
        </article>

        <!-- =========================
             RECEPTION
        ========================== -->

        <article class="event-card">
          <div class="event-icon">✨</div>

          <p class="event-type" id="reception-event-type"></p>

          <h3 id="reception-event-title"></h3>

          <div class="event-divider">✦</div>

          <p class="event-date" id="reception-event-date"></p>

          <p class="event-time" id="reception-event-time"></p>

          <p class="event-location" id="reception-event-location"></p>

          <div class="event-buttons">
            <button
              type="button"
              class="event-button"
              id="reception-event-button"
              onclick="openEvent('reception')"
            ></button>

            <a
              class="location-button"
              id="reception-location-button"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            ></a>
          </div>
        </article>
      </div>
    </section>

    <!-- =========================
         FAMILY & COUPLE SECTION
    ========================== -->

    <section class="family-section">
      <div class="section-heading">
        <p class="section-label" id="story-label"></p>

        <h2 id="story-title"></h2>

        <div class="heading-divider">✦</div>

        <p id="story-description"></p>
      </div>

      <!-- =========================
           COUPLE
      ========================== -->

      <div class="family-gallery-section">
        <div class="family-gallery-heading">
          <p class="section-label" id="couple-family-label"></p>

          <h3 id="couple-family-title"></h3>
        </div>

        <div class="photo-slider">
          <button
            type="button"
            class="slider-button prev"
            onclick="scrollGallery('couple-gallery', -1)"
            id="couple-prev-button"
          >
            ‹
          </button>

          <div class="photo-track" id="couple-gallery"></div>

          <button
            type="button"
            class="slider-button next"
            onclick="scrollGallery('couple-gallery', 1)"
            id="couple-next-button"
          >
            ›
          </button>
        </div>
      </div>

      <!-- =========================
           GROOM FAMILY
      ========================== -->

      <div class="family-gallery-section">
        <div class="family-gallery-heading">
          <p class="section-label" id="groom-family-label"></p>

          <h3 id="groom-family-title"></h3>
        </div>

        <div class="photo-slider">
          <button
            type="button"
            class="slider-button prev"
            onclick="scrollGallery('groom-gallery', -1)"
            id="groom-prev-button"
          >
            ‹
          </button>

          <div class="photo-track" id="groom-gallery"></div>

          <button
            type="button"
            class="slider-button next"
            onclick="scrollGallery('groom-gallery', 1)"
            id="groom-next-button"
          >
            ›
          </button>
        </div>
      </div>

      <!-- =========================
           BRIDE FAMILY
      ========================== -->

      <div class="family-gallery-section">
        <div class="family-gallery-heading">
          <p class="section-label" id="bride-family-label"></p>

          <h3 id="bride-family-title"></h3>
        </div>

        <div class="photo-slider">
          <button
            type="button"
            class="slider-button prev"
            onclick="scrollGallery('bride-gallery', -1)"
            id="bride-prev-button"
          >
            ‹
          </button>

          <div class="photo-track" id="bride-gallery"></div>

          <button
            type="button"
            class="slider-button next"
            onclick="scrollGallery('bride-gallery', 1)"
            id="bride-next-button"
          >
            ›
          </button>
        </div>
      </div>
    </section>

    <!-- =========================
         COUNTDOWN SECTION
    ========================== -->

    <section class="countdown-section">
      <div class="countdown-content">
        <p class="section-label" id="countdown-label"></p>

        <h2 id="countdown-title"></h2>

        <p class="countdown-message" id="countdown-message"></p>

        <div class="countdown">
          <div class="countdown-box">
            <span id="days">00</span>
            <small id="countdown-days-label"></small>
          </div>

          <div class="countdown-box">
            <span id="hours">00</span>
            <small id="countdown-hours-label"></small>
          </div>

          <div class="countdown-box">
            <span id="minutes">00</span>
            <small id="countdown-minutes-label"></small>
          </div>

          <div class="countdown-box">
            <span id="seconds">00</span>
            <small id="countdown-seconds-label"></small>
          </div>
        </div>

        <div class="countdown-date" id="countdown-date"></div>

        <div class="countdown-heart">♥</div>
      </div>
    </section>

    <!-- =========================
         THANK YOU SECTION
    ========================== -->

    <section class="thank-you-section">
      <div class="thank-you-content">
        <div class="thank-you-heart">♥</div>

        <p class="section-label" id="thank-you-label"></p>

        <h2 id="thank-you-title"></h2>

        <div class="heading-divider">✦</div>

        <p class="thank-you-message" id="thank-you-message-one"></p>

        <p class="thank-you-message" id="thank-you-message-two"></p>

        <div class="thank-you-names" id="thank-you-names"></div>

        <p class="thank-you-date" id="thank-you-date"></p>

        <div class="thank-you-divider">
          <span></span>
          <span>♥</span>
          <span></span>
        </div>

        <button
          type="button"
          class="back-to-top"
          id="back-to-top-button"
          onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
        ></button>
      </div>
    </section>

    <!-- =========================
         EVENT DETAILS MODAL
    ========================== -->

    <div
      class="event-modal"
      id="event-modal"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-event-title"
    >
      <div
        class="event-modal-overlay"
        onclick="closeEvent()"
        aria-hidden="true"
      ></div>

      <div class="event-modal-content">
        <button
          type="button"
          class="event-modal-close"
          id="modal-close-button"
          onclick="closeEvent()"
          aria-label=""
        >
          ×
        </button>

        <div class="event-modal-inner">
          <p class="section-label" id="modal-event-type"></p>

          <h2 id="modal-event-title"></h2>

          <div class="heading-divider">✦</div>

          <div class="modal-event-info">
            <p id="modal-event-date"></p>

            <p id="modal-event-time"></p>

            <p id="modal-event-location"></p>
          </div>

          <a
            id="modal-map-button"
            class="location-button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          ></a>

          <!-- =========================
               EVENT SCHEDULE
          ========================== -->

          <div class="event-timeline-section">
            <p class="section-label" id="modal-schedule-label"></p>

            <h3 id="modal-schedule-title"></h3>

            <div class="event-timeline" id="event-timeline"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- =========================
         SCRIPTS
    ========================== -->

    <script src="config/wedding.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
